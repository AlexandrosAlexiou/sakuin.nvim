[package]
name = "sakuin"
version = "0.5.0"
edition = "2021"
description = "Indexed full-text search engine for Neovim, powered by Tantivy"
license = "MIT"

[lib]
name = "sakuin"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sakuin-cli"
path = "cli/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tantivy = "0.26"
rayon = "1.10"
notify = { version = "8.2.0", features = ["macos_fsevent"] }
notify-debouncer-full = "0.7.0"
ignore = "0.4"
git2 = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
