name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,    libname: libsakuin.so,    artifact: libsakuin-x86_64-unknown-linux-gnu.so,    toolchain: stable,  components: "",         extra_args: "" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu,   libname: libsakuin.so,    artifact: libsakuin-aarch64-unknown-linux-gnu.so,   toolchain: stable,  components: "",         extra_args: "" }
          # Linux musl
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,   libname: libsakuin.so,    artifact: libsakuin-x86_64-unknown-linux-musl.so,   toolchain: stable,  components: "",         extra_args: "" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl,  libname: libsakuin.so,    artifact: libsakuin-aarch64-unknown-linux-musl.so,  toolchain: stable,  components: "",         extra_args: "" }
          # FreeBSD
          - { os: ubuntu-latest, target: x86_64-unknown-freebsd,      libname: libsakuin.so,    artifact: libsakuin-x86_64-unknown-freebsd.so,      toolchain: stable,  components: "",         extra_args: "" }
          - { os: ubuntu-latest, target: aarch64-unknown-freebsd,     libname: libsakuin.so,    artifact: libsakuin-aarch64-unknown-freebsd.so,     toolchain: stable,  components: "",         extra_args: "" }
          # OpenBSD (tier 3 — needs nightly + rust-src + -Z build-std)
          - { os: ubuntu-latest, target: x86_64-unknown-openbsd,      libname: libsakuin.so,    artifact: libsakuin-x86_64-unknown-openbsd.so,      toolchain: nightly, components: "rust-src", extra_args: "-Z build-std=std,panic_abort" }
          - { os: ubuntu-latest, target: aarch64-unknown-openbsd,     libname: libsakuin.so,    artifact: libsakuin-aarch64-unknown-openbsd.so,     toolchain: nightly, components: "rust-src", extra_args: "-Z build-std=std,panic_abort" }
          # Android
          - { os: ubuntu-latest, target: aarch64-linux-android,       libname: libsakuin.so,    artifact: libsakuin-aarch64-linux-android.so,       toolchain: stable,  components: "",         extra_args: "" }
          # macOS
          - { os: macos-14,      target: aarch64-apple-darwin,        libname: libsakuin.dylib, artifact: libsakuin-aarch64-apple-darwin.dylib,     toolchain: stable,  components: "",         extra_args: "" }
          - { os: macos-14,      target: x86_64-apple-darwin,         libname: libsakuin.dylib, artifact: libsakuin-x86_64-apple-darwin.dylib,      toolchain: stable,  components: "",         extra_args: "" }
          # Windows MSVC
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     libname: sakuin.dll,      artifact: sakuin-x86_64-pc-windows-msvc.dll,        toolchain: stable,  components: "",         extra_args: "" }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,    libname: sakuin.dll,      artifact: sakuin-aarch64-pc-windows-msvc.dll,       toolchain: stable,  components: "",         extra_args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.components }}
          args: "--manifest-path rust/Cargo.toml --release --lib ${{ matrix.extra_args }}"

      - name: Stage artifact
        shell: bash
        run: |
          src="rust/target/${{ matrix.target }}/release/${{ matrix.libname }}"
          dest="${{ matrix.artifact }}"
          cp "$src" "$dest"
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --sign - --force "$dest"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$dest" > "$dest.sha256"
          else
            shasum -a 256 "$dest" > "$dest.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
