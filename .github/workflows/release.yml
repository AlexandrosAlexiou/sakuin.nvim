name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,   libname: libsakuin.so,    artifact: libsakuin-x86_64-unknown-linux-gnu.so }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu,  libname: libsakuin.so,    artifact: libsakuin-aarch64-unknown-linux-gnu.so }
          # Linux musl
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,  libname: libsakuin.so,    artifact: libsakuin-x86_64-unknown-linux-musl.so }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, libname: libsakuin.so,    artifact: libsakuin-aarch64-unknown-linux-musl.so }
          # Android
          - { os: ubuntu-latest, target: aarch64-linux-android,      libname: libsakuin.so,    artifact: libsakuin-aarch64-linux-android.so }
          # FreeBSD — x86_64 has prebuilt std; aarch64 requires build-std + nightly
          - { os: ubuntu-latest, target: x86_64-unknown-freebsd,     libname: libsakuin.so,    artifact: libsakuin-x86_64-unknown-freebsd.so }
          - { os: ubuntu-latest, target: aarch64-unknown-freebsd,    libname: libsakuin.so,    artifact: libsakuin-aarch64-unknown-freebsd.so, build_std: true }
          # macOS
          - { os: macos-latest,  target: aarch64-apple-darwin,       libname: libsakuin.dylib, artifact: libsakuin-aarch64-apple-darwin.dylib }
          - { os: macos-latest,  target: x86_64-apple-darwin,        libname: libsakuin.dylib, artifact: libsakuin-x86_64-apple-darwin.dylib }
          # Windows MSVC
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    libname: sakuin.dll,      artifact: sakuin-x86_64-pc-windows-msvc.dll }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,   libname: sakuin.dll,      artifact: sakuin-aarch64-pc-windows-msvc.dll }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          if [ -z "${{ matrix.build_std }}" ] || [ "${{ matrix.build_std }}" = "false" ]; then
            rustup toolchain install stable --profile minimal
            rustup default stable
            rustup target add ${{ matrix.target }}
          else
            rustup toolchain install nightly --profile minimal
            rustup default nightly
          fi

      - name: Build (cross — Linux/Android/FreeBSD)
        if: contains(matrix.os, 'ubuntu')
        working-directory: rust
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross build --release --lib --target ${{ matrix.target }} ${{ matrix.build_std && '-Z build-std' || '' }}

      - name: Build (native — macOS)
        if: contains(matrix.os, 'macos')
        working-directory: rust
        env:
          MACOSX_DEPLOYMENT_TARGET: "13"
        run: cargo build --release --lib --target ${{ matrix.target }}

      - name: Build (native — Windows)
        if: contains(matrix.os, 'windows')
        working-directory: rust
        shell: bash
        run: cargo build --release --lib --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          src="rust/target/${{ matrix.target }}/release/${{ matrix.libname }}"
          dest="${{ matrix.artifact }}"
          cp "$src" "$dest"
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --sign - --force "$dest"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$dest" > "$dest.sha256"
          else
            shasum -a 256 "$dest" > "$dest.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  build-openbsd:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, version: "7.8", target: x86_64-unknown-openbsd,  artifact: libsakuin-x86_64-unknown-openbsd.so }
          - { arch: arm64,  version: "7.8", target: aarch64-unknown-openbsd, artifact: libsakuin-aarch64-unknown-openbsd.so }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build in OpenBSD VM (${{ matrix.arch }})
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: openbsd
          architecture: ${{ matrix.arch }}
          version: ${{ matrix.version }}
          memory: 4G
          shell: sh
          sync_files: true
          run: |
            sudo pkg_add rust
            rustc -vV
            cd rust
            cargo build --release --lib

      - name: Stage artifact
        run: |
          cp rust/target/release/libsakuin.so "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: Create Release
    needs: [build, build-openbsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
