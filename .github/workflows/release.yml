name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: libsakuin-x86_64-linux.so
            lib_name: libsakuin.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: libsakuin-aarch64-linux.so
            lib_name: libsakuin.so
            use_cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: libsakuin-aarch64-darwin.dylib
            lib_name: libsakuin.dylib
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: libsakuin-x86_64-darwin.dylib
            lib_name: libsakuin.dylib
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact_name: sakuin-x86_64-windows.dll
            lib_name: sakuin.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --manifest-path rust/Cargo.toml --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --manifest-path rust/Cargo.toml --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          src="rust/target/${{ matrix.target }}/release/${{ matrix.lib_name }}"
          cp "$src" "${{ matrix.artifact_name }}"

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
