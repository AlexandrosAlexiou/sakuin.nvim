name: Spelling

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typos:
    name: Spell check with typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: crate-ci/typos@685eb3d55be2f85191e8c84acb9f44d7756f84ab # v1.29.4
